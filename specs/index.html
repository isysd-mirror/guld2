<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Guld 2.0 normative draft specifications — overview, identity, transactions, consensus, and more."
    />
    <meta property="og:url" content="https://guld.io/specs/" />
    <meta property="og:title" content="Guld 2.0 Specs" />
    <meta property="og:image" content="https://guld.io/assets/og.jpg" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'"

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/src/css/tokens.css" />
    <link rel="stylesheet" href="/src/css/base.css" />
    <link rel="stylesheet" href="/src/css/layout.css" />
    <link rel="stylesheet" href="/src/css/docs.css" />
    <title>Guld 2.0 Specs</title>
  </head>
  <body>
    <header class="site-header site-header--solid">
      <a class="site-header__brand" href="/" aria-label="Guld home">
        <img src="/assets/logo.svg" width="120" height="40" alt="Guld" />
      </a>
      <nav class="site-header__nav" aria-label="Primary">
        <a href="/whitepaper/">Whitepaper</a>
        <a href="/specs/" aria-current="page">Specs</a>
        <a href="/explorer/">Explorer</a>
      </nav>

    <div class="doc-layout" data-specs-shell>
      <aside class="doc-aside" data-doc-toc hidden></aside>
      <main class="doc-main" id="main">
        <section class="section" data-specs-index style="padding-left: 0; padding-right: 0">
          <h1>Specifications</h1>
          <p>
            Normative drafts for Guld 2.0. Intent lives in the
            <a href="/whitepaper/">whitepaper</a>; these specs define components and APIs.
            Status: <strong>draft</strong>.
          </p>
          <ol class="spec-list" data-spec-list></ol>
        </section>
        <div data-doc-host hidden></div>
      </main>
    </div>

    <footer class="site-footer">
      <img src="/assets/guld.svg" width="32" height="32" alt="" />
      <p>
        <a href="/whitepaper/">Whitepaper</a> ·
        <a href="/docs/specs/README.md">Specs index (Markdown)</a>
      </p>
    </footer>

    <script type="module" src="/src/js/specs-page.js"></script>
