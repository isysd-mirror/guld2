<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Claim your Guld 1.0 legacy balance on Guld 2.0 — PGP proof and key upgrade."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; worker-src 'self'; manifest-src 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/src/css/tokens.css" />
    <link rel="stylesheet" href="/src/css/base.css" />
    <link rel="stylesheet" href="/src/css/layout.css" />
    <link rel="stylesheet" href="/src/css/docs.css" />
    <link rel="stylesheet" href="/src/css/wallet.css" />
    <title>Legacy claim — Guld</title>
  </head>
  <body class="site-body">
    <guld-header></guld-header>
    <main class="site-main wallet" id="main">
      <header class="wallet__head">
        <h1>Legacy claim</h1>
        <p>
          For ~2,217 Guld 1.0 holders with imported balances. Look up your name,
          generate a wallet key, cleartext-sign the claim message with your 1.0
          PGP key, then submit.
        </p>
      </header>
      <p class="wallet__status" data-claim-status data-state="pending">Loading…</p>
      <div data-claim-host></div>
    </main>
    <guld-footer></guld-footer>
    <script type="module" src="/src/js/claim-page.js"></script>
  </body>
</html>
