<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Guld 2.0 beta explorer — Simba testnet blocks and transactions from a connected node."
    />
    <meta property="og:url" content="https://guld.io/explorer/" />
    <meta property="og:title" content="Guld explorer (Simba testnet)" />
    <meta property="og:image" content="https://guld.io/assets/og.jpg" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' http: https:; worker-src 'self'; manifest-src 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/src/css/tokens.css" />
    <link rel="stylesheet" href="/src/css/base.css" />
    <link rel="stylesheet" href="/src/css/layout.css" />
    <link rel="stylesheet" href="/src/css/docs.css" />
    <link rel="stylesheet" href="/src/css/explorer.css" />
    <title>Explorer — Guld</title>
  </head>
  <body class="site-body">
    <guld-header></guld-header>

    <main class="site-main explorer" id="main">
      <header class="explorer__toolbar">
        <form data-explorer-lookup class="explorer__search">
          <label class="visually-hidden" for="explorer-q">Search</label>
          <input
            id="explorer-q"
            name="q"
            type="search"
            spellcheck="false"
            autocomplete="off"
            placeholder="Name, height, height:index, or 0x…"
            required
          />
          <button type="submit" class="btn btn--outline">Search</button>
        </form>
        <div data-explorer-suggest class="explorer__suggest" hidden></div>
        <p class="explorer__meta" data-explorer-status data-state="pending">Connecting…</p>
      </header>

      <div data-explorer-host>
        <p class="doc-status">Loading…</p>
      </div>
    </main>

    <guld-footer></guld-footer>

    <script type="module" src="/src/js/explorer-page.js"></script>
  </body>
</html>
