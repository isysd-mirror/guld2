<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Register a Guld username — pick a name, generate keys, get sponsored on-chain." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self' https://app.paymento.io; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; worker-src 'self'; manifest-src 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/src/css/tokens.css" />
    <link rel="stylesheet" href="/src/css/base.css" />
    <link rel="stylesheet" href="/src/css/layout.css" />
    <link rel="stylesheet" href="/src/css/docs.css" />
    <link rel="stylesheet" href="/src/css/wallet.css" />
    <title>Sign up — Guld</title>
  </head>
  <body class="site-body">
    <guld-header></guld-header>
    <main class="site-main wallet" id="main">
      <header class="wallet__head">
        <h1 data-register-title>Sign up</h1>
        <p data-register-lead>
          Choose an available name and generate keys in this browser. A funded
          sponsor (testnet faucet, friend, or optional paid desk) pays the
          on-chain registration fee in GULD.
        </p>
      </header>

      <ol class="register-steps" data-register-steps>
        <li data-step="1" class="is-active"><span>Name</span></li>
        <li data-step="2"><span>Keys</span></li>
        <li data-step="3"><span>Sponsor</span></li>
        <li data-step="4"><span>Wait</span></li>
      </ol>

      <p class="wallet__status" data-register-status data-state="pending">Checking desk…</p>
      <div data-register-host></div>
    </main>
    <guld-footer></guld-footer>
    <script type="module" src="/src/js/register-page.js"></script>
  </body>
</html>
