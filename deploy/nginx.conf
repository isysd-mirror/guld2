# Guld — HTTPS vhost (certs already at /etc/letsencrypt/live/guld.io/)
#
# Install:
#   sudo ./deploy/install-nginx-snippets.sh
#   sudo ./deploy/install-bind-mount.sh
#   sudo ./deploy/install-nginx-site.sh
#
# Do not blind-overwrite if Certbot later rewrites ssl_certificate* lines — keep those.

# --- HTTP: ACME + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name guld.io www.guld.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/guld.io;
        allow all;
    }

    location / {
        return 301 https://guld.io$request_uri;
    }
}

# --- HTTPS: www → apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.guld.io;

    ssl_certificate /etc/letsencrypt/live/guld.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guld.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://guld.io$request_uri;
}

# --- HTTPS: canonical site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guld.io;

    ssl_certificate /etc/letsencrypt/live/guld.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guld.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guld.io;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    include mime.types;
    types {
        application/manifest+json  webmanifest;
        text/javascript            js mjs;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/manifest+json
        application/json
        image/svg+xml;

    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    include /etc/nginx/snippets/guld/guld-api-proxy.conf;
    include /etc/nginx/snippets/guld/guld-static-locations.conf;
}
