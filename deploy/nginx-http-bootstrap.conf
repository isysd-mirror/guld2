# Guld — HTTP bootstrap (BEFORE Certbot / while DNS pending)
# Do not send HSTS here.
#
#   sudo ./deploy/install-nginx-snippets.sh
#   sudo cp deploy/nginx-http-bootstrap.conf /etc/nginx/sites-available/guld.io
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name guld.io www.guld.io;

    root /var/www/guld.io;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/guld.io;
        allow all;
    }

    include mime.types;
    types {
        application/manifest+json  webmanifest;
        text/javascript            js mjs;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/manifest+json
        application/json
        image/svg+xml;

    include /etc/nginx/snippets/guld/guld-api-proxy.conf;
    include /etc/nginx/snippets/guld/guld-static-locations-http.conf;
}
