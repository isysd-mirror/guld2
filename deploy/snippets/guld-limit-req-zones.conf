# Rate-limit zones for guld.io faucet / webhook (http{} context).
#
# Include once from the main nginx.conf http block, e.g.:
#   include /etc/nginx/snippets/guld/guld-limit-req-zones.conf;
#
# Then reload nginx. Locations that use these zones live in guld-api-proxy.conf.

limit_req_zone $binary_remote_addr zone=guld_faucet:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=guld_webhook:10m rate=60r/m;
