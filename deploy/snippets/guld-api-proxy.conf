# Reverse-proxy guld-node HTTP (--http 127.0.0.1:8088).
# Product routes (API, static, /repos/) live in the node — nginx only forwards.
#
# Optional edge rate limits: include guld-api-rate-limits.conf *before* this file
# (after guld-limit-req-zones.conf in http{}). See faucet-registrar-hardening.md.

location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
