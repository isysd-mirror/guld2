# Static site locations — HTTPS
location ~ /\. {
    deny all;
}
location ^~ /node_modules/ {
    deny all;
}
location = /package.json {
    deny all;
}
location = /package-lock.json {
    deny all;
}

location = /sw.js {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ^~ /src/ {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ^~ /assets/ {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri $uri/ =404;
}

# Dumb HTTP git: when nginx still serves files from disk (transitional).
# Preferred: proxy all traffic to guld-node --http-static (see docs/HOSTING.md).
# Product rules for /repos/ live in guld-node, not here.
location ^~ /repos/ {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ^~ /archives/ {
    deny all;
}

location ^~ /.guld-data/ {
    deny all;
}

location / {
    include /etc/nginx/snippets/guld/guld-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
