# Edge rate limits for faucet mutate + Paymento webhook.
# Requires: include guld-limit-req-zones.conf in http{}.
# Include this *before* guld-api-proxy.conf inside the server block.

location = /api/v1/faucet/drip {
    limit_req zone=guld_faucet burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

location = /api/v1/faucet/register {
    limit_req zone=guld_faucet burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

location = /api/v1/payment-gateway-webhook {
    limit_req zone=guld_webhook burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
